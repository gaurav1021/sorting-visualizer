<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sorting Visualizer</title>

    <link rel="stylesheet" href="./css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Marhey:wght@700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">Sorting Visualizer</span>
      </div>

      <nav class="algos" aria-label="Choose a sorting algorithm">
        <button>Bubble</button>
        <button>Selection</button>
        <button>Insertion</button>
        <button>Merge</button>
        <button>Quick</button>
        <button>Heap</button>
      </nav>
    </header>

    <main class="app">
      <section class="controls">
        <div class="control">
          <label for="a_size">
            Array size <span class="control-val" id="size_val">80</span>
          </label>
          <input id="a_size" type="range" min="20" max="150" step="1" value="80" />
        </div>

        <div class="control">
          <label for="a_speed">
            Speed <span class="control-val" id="speed_val">×4</span>
          </label>
          <input id="a_speed" type="range" min="1" max="5" step="1" value="4" />
        </div>

        <button id="a_generate" class="btn-generate">Generate new array</button>

        <ul class="legend" aria-label="Colour legend">
          <li><i class="sw idle"></i> Idle</li>
          <li><i class="sw cmp"></i> Comparing</li>
          <li><i class="sw act"></i> Swapping</li>
          <li><i class="sw done"></i> Sorted</li>
        </ul>
      </section>

      <section class="stage">
        <div id="array_container"></div>
      </section>

      <section class="complexity">
        <div class="card" id="Info_Cont1">
          <h3>Time Complexity</h3>
          <div class="cx-grid" id="Time_Complexity_Types_Container">
            <div class="cx">
              <span class="cx-k">Worst case</span>
              <span class="cx-v" id="Time_Worst">—</span>
            </div>
            <div class="cx">
              <span class="cx-k">Average case</span>
              <span class="cx-v" id="Time_Average">—</span>
            </div>
            <div class="cx">
              <span class="cx-k">Best case</span>
              <span class="cx-v" id="Time_Best">—</span>
            </div>
          </div>
        </div>

        <div class="card" id="Info_Cont2">
          <h3>Space Complexity</h3>
          <div class="cx-grid" id="Space_Complexity_Types_Container">
            <div class="cx">
              <span class="cx-k">Worst case</span>
              <span class="cx-v" id="Space_Worst">—</span>
            </div>
          </div>
        </div>
      </section>

      <div id="cinfo"></div>
    </main>

    <script src="./scripts/main.js"></script>
    <!--This should be at the end of body and should be loaded before sorts.js-->
    <script src="./scripts/visualizations.js"></script>
    <!--This should be loaded after main.js-->

    <script src="./scripts/bubble_sort.js"></script>
    <script src="./scripts/selection_sort.js"></script>
    <script src="./scripts/insertion_sort.js"></script>
    <script src="./scripts/merge_sort.js"></script>
    <script src="./scripts/quick_sort.js"></script>
    <script src="./scripts/heap_sort.js"></script>
  </body>

  <!--
    *****************
    DONE BY:-   Gaurav Mangal

    *****************
--></html>
